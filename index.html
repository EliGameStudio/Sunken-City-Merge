<script>
/* Сторож запуска. Если через 4 секунды игра не подала признаков жизни,
   значит страницу испортил старый service worker или битый кэш:
   сносим всё это и перезагружаемся ОДИН раз. */
(function(){
  try{
    var KEY='sunken_selfheal';
    window.__gameStarted=0;
    window.__healed=(function(){ try{ return sessionStorage.getItem(KEY)==='1'; }catch(e){ return false; } })();
    setTimeout(function(){
      if(window.__gameStarted) return;
      if(window.__healed) return;                       // лечим только один раз за сессию
      try{ sessionStorage.setItem(KEY,'1'); }catch(e){}
      var done=function(){ try{ location.reload(); }catch(e){} };
      var jobs=[];
      try{
        if('serviceWorker' in navigator)
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
            return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
      }catch(e){}
      try{
        if(window.caches&&caches.keys)
          jobs.push(caches.keys().then(function(ks){
            return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      }catch(e){}
      if(jobs.length) Promise.all(jobs).then(done, done); else done();
    }, 4000);
  }catch(e){}
})();
</script>
<script>
(function(){
'use strict';
var VW=540, VH=960;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.width=VW; cv.height=VH;
ctx.imageSmoothingEnabled=false;

/* ---------- масштаб под экран телефона ---------- */
var scale=1, offX=0, offY=0;
var FIT_OK=false, FIT_TRIES=0;
function fit(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||0;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||0;
  if(!(vw>40&&vh>40)){                        // экран ещё не измерен — попробуем позже
    FIT_OK=false; FIT_TRIES++;
    if(FIT_TRIES<40&&typeof setTimeout!=='undefined') setTimeout(fit,100);
    return;
  }
  FIT_OK=true;
  var dpr=Math.min(2, window.devicePixelRatio||1);
  scale=Math.min(vw/VW, vh/VH);
  var w=Math.floor(VW*scale), h=Math.floor(VH*scale);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.floor(VW*dpr); cv.height=Math.floor(VH*dpr);
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingEnabled=false;
  var r=cv.getBoundingClientRect(); offX=r.left; offY=r.top;
  if(!(r.width>40&&r.height>40)){             // холст не получил размер — ещё попытка
    FIT_OK=false; FIT_TRIES++;
    if(FIT_TRIES<40&&typeof setTimeout!=='undefined') setTimeout(fit,120);
  }
}
window.addEventListener('resize',fit);
window.addEventListener('load',function(){ fit(); });
window.addEventListener('pageshow',function(){ fit(); });
window.addEventListener('orientationchange',function(){setTimeout(fit,120);});
document.addEventListener('visibilitychange',function(){setTimeout(fit,60);});
if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);

/* ---------- палитра, лесенка тонов (15.3) ---------- */
function _hx(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function _hex(r,g,b){r=Math.max(0,Math.min(255,Math.round(r)));g=Math.max(0,Math.min(255,Math.round(g)));
  b=Math.max(0,Math.min(255,Math.round(b)));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function mixHex(a,b,t){var A=_hx(a),B=_hx(b);
  return _hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function coolHex(h,t){var A=_hx(h);return _hex(A[0]-A[0]*t*0.30,A[1]-A[1]*t*0.10,A[2]+(255-A[2])*t*0.16);}
function warmHex(h,t){var A=_hx(h);return _hex(A[0]+(255-A[0])*t*0.30,A[1]+(255-A[1])*t*0.16,A[2]-A[2]*t*0.12);}
function buildRamp(P){
  var e=mixHex(coolHex(P[0],0.22), P[1], 0.46), b=P[1], l=P[2], hi=warmHex(P[3],0.22);
  return [e, mixHex(e,b,0.42), mixHex(e,b,0.74), b, mixHex(b,l,0.50), l, mixHex(l,hi,0.50), hi];
}
function R(arr){ return function(i){ return arr[i<0?0:(i>7?7:i)]; }; }

/* ---------- детерминированная случайность (15.2) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
var rndGame=mulberry32(20260729);

/* ---------- примитивы (15.1) ---------- */
function prims(c){
  function rp(x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));}
  function px(x,y,col){rp(x,y,1,1,col);}
  function circ(cx,cy,r,col){cx|=0;cy|=0;r=Math.round(r);c.fillStyle=col;
    for(var y=-r;y<=r;y++){var w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));c.fillRect(cx-w,cy+y,2*w+1,1);}}
  function ell(cx,cy,rx,ry,col){cx|=0;cy|=0;rx=Math.round(rx);ry=Math.round(ry);c.fillStyle=col;
    for(var y=-ry;y<=ry;y++){var w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));c.fillRect(cx-w,cy+y,2*w+1,1);}}
  function poly(pts,col){var mn=1e9,mx=-1e9,i;
    for(i=0;i<pts.length;i++){if(pts[i][1]<mn)mn=pts[i][1];if(pts[i][1]>mx)mx=pts[i][1];}
    c.fillStyle=col;
    for(var y=Math.floor(mn);y<=Math.ceil(mx);y++){var xs=[];
      for(i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length];
        if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y)) xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
      xs.sort(function(p,q){return p-q;});
      for(i=0;i+1<xs.length;i+=2){var x0=Math.round(xs[i]),x1=Math.round(xs[i+1]);
        if(x1>x0) c.fillRect(x0,y,x1-x0,1);}}}
  function dith(x,y,w,h,col,rnd,prob){          // только по телу объекта
    var old=c.globalCompositeOperation; c.globalCompositeOperation='source-atop';
    for(var b=0;b<h;b++)for(var a=0;a<w;a++)
      if((((x+a)+(y+b))&1)===0 && rnd()<prob) px(x+a,y+b,col);
    c.globalCompositeOperation=old;}
  return {rp:rp,px:px,circ:circ,ell:ell,poly:poly,dith:dith};
}

/* ---------- запекание спрайта + финальный контур и ореол (4, 15.4) ---------- */
var OUTLINE='#2b3d6b', HALO='#eafaff';
function contourHalo(cvs,halo){
  var c=cvs.getContext('2d'), W=cvs.width, H=cvs.height;
  var img=c.getImageData(0,0,W,H), d=img.data, x,y,i;
  function op(x,y){return x>=0&&y>=0&&x<W&&y<H&&d[(y*W+x)*4+3]>40;}
  var edge=[];
  for(y=0;y<H;y++)for(x=0;x<W;x++) if(op(x,y)&&(!op(x-1,y)||!op(x+1,y)||!op(x,y-1)||!op(x,y+1))) edge.push(y*W+x);
  var oc=_hx(OUTLINE), k;
  for(k=0;k<edge.length;k++){i=edge[k]*4;d[i]=oc[0];d[i+1]=oc[1];d[i+2]=oc[2];d[i+3]=255;}
  if(halo!==false){
    var es={}; for(k=0;k<edge.length;k++) es[edge[k]]=1;
    var hc=_hx(HALO), add=[];
    for(y=0;y<H;y++)for(x=0;x<W;x++){ if(op(x,y)) continue;
      var near=false;
      for(var b=-1;b<=1&&!near;b++)for(var a=-1;a<=1;a++) if(es[(y+b)*W+(x+a)]){near=true;break;}
      if(near) add.push(y*W+x);
    }
    for(k=0;k<add.length;k++){i=add[k]*4;d[i]=hc[0];d[i+1]=hc[1];d[i+2]=hc[2];d[i+3]=255;}
  }
  c.putImageData(img,0,0);
  return cvs;
}
function newCanvas(w,h){
  var e=(typeof document!=='undefined'&&document.createElement)?document.createElement('canvas'):null;
  e.width=w; e.height=h; return e;
}
var SPRITES={}, BAKE_MS=0, BAKE_PX=0;
function sprite(key,w,h,draw,halo){          // ленивое запекание
  if(SPRITES[key]) return SPRITES[key];
  var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
  var e=newCanvas(w,h), c=e.getContext('2d');
  c.imageSmoothingEnabled=false;
  draw(c, prims(c));
  contourHalo(e,halo);
  SPRITES[key]=e; BAKE_PX+=w*h;
  BAKE_MS+=((typeof performance!=='undefined'&&performance.now)?performance.now():0)-t0;
  return e;
}

/* ================= ЦЕПОЧКИ И ПАЛИТРЫ ================= */
var RA={
  shell : R(buildRamp(['#8a2f60','#ff6bb0','#ffb3d9','#fff0f8'])),
  pearl : R(buildRamp(['#4a7d92','#bfe9f5','#eafcff','#ffffff'])),
  brass : R(buildRamp(['#7a4a12','#c98a1f','#f2c14e','#fff0b8'])),
  steel : R(buildRamp(['#3f579a','#7fa8e0','#cfe0f5','#ffffff'])),
  gold  : R(buildRamp(['#8a4a0c','#ffbe2e','#ffe27a','#fffbe0'])),
  ruby  : R(buildRamp(['#8a1a34','#ff3b6b','#ff9fb4','#ffe6ec'])),
  wood  : R(buildRamp(['#5a3418','#8a4f22','#c68449','#f0cfa8'])),
  weed  : R(buildRamp(['#1d7a3a','#3fd66b','#9bf7a8','#eaffe8'])),
  coral : R(buildRamp(['#94324a','#ff7a4d','#ffb38a','#ffe8d8'])),
  glass : R(buildRamp(['#0d5f80','#2fd0ff','#9df0ff','#f0ffff'])),
  orang : R(buildRamp(['#8f5410','#ff9c1f','#ffc76b','#fff0d0'])),
  stone : R(buildRamp(['#4a6f8a','#7fa8c8','#c3d9e6','#f2fbff']))
};
var CHAINS=[
  {id:'shell', name:'Shells',   max:10, tip:'Shell'},
  {id:'gear',  name:'Machines', max:10, tip:'Gear'},
  {id:'gold',  name:'Treasure', max:10, tip:'Coin'},
  {id:'flora', name:'Flora',    max:9,  tip:'Sprig'},
  {id:'tool',  name:'Tools',    max:8,  tip:'Tool'}
];
var TIER_NAMES=[
  ['Chip','Clam','Scallop','Conch','Pearl Shell','Nautilus','Great Pearl','Siren Horn','Tide Lens','Abyss Pearl'],
  ['Bolt','Cog','Gear','Rotor','Engine','Turbine','Core','Regulator','Tide Engine','Prime Core'],
  ['Coin','Coins','Pouch','Casket','Chest','Hoard','Crown','Reliquary','Royal Seal','Deep Vault'],
  ['Sprig','Weed','Bush','Fan','Reef','Grove','Coral Tree','Living Reef','Reef Heart'],
  ['Brush','Chisel','Wrench','Lantern','Drill','Sonar','Diving Rig','Salvage Crane']
];
var IS=86;                                   // +19% к прежним 72                                   // размер спрайта предмета


/* ================= ОБЩИЕ ФОРМЫ ДЛЯ ПРЕДМЕТОВ ================= */
function shp(g){
  var rp=g.rp, px=g.px, circ=g.circ, ell=g.ell, poly=g.poly, dith=g.dith;

  function orb(cx,cy,r,R){                        // сфера со светом сверху-слева
    circ(cx,cy,r,R(2)); circ(cx-1,cy-1,r-1,R(3));
    circ(cx-2,cy-2,Math.max(1,r-3),R(5));
    circ(cx-3,cy-3,Math.max(1,r-6),R(6));
    px(cx-Math.round(r*0.45),cy-Math.round(r*0.45),R(7));
  }
  function ring(cx,cy,r,R,n,sz){                  // светящееся кольцо точками
    n=n||12; sz=sz||1;
    for(var i=0;i<n;i++){ var a=i/n*Math.PI*2;
      rp(cx+Math.round(Math.cos(a)*r)-((sz-1)>>1), cy+Math.round(Math.sin(a)*r)-((sz-1)>>1), sz, sz, R(6)); }
  }
  function rays(cx,cy,r0,r1,R,n){                 // лучи из центра
    n=n||8;
    for(var i=0;i<n;i++){ var a=i/n*Math.PI*2;
      for(var k=r0;k<r1;k++) if((k&1)===0)
        px(cx+Math.round(Math.cos(a)*k), cy+Math.round(Math.sin(a)*k), R(6)); }
  }
  function box(x,y,w,h,R,bands){                  // ящик с фасками и полосами
    rp(x,y,w,h,R(3)); rp(x,y,w,2,R(5)); rp(x,y,2,h,R(4));
    rp(x+w-2,y,2,h,R(1)); rp(x,y+h-2,w,2,R(1));
    if(bands) for(var i=1;i<bands+1;i++) rp(x+Math.round(i*w/(bands+1))-1,y,2,h,R(1));
  }
  function glass(x,y,w,h,R){                      // остеклённое окно
    rp(x,y,w,h,R(1)); rp(x+1,y+1,w-2,h-2,R(3));
    rp(x+1,y+1,Math.max(1,w-2>>1),Math.max(1,h-2>>1),R(5));
    px(x+2,y+2,R(7));
  }
  function toothed(cx,cy,r,n,R){                  // зубчатое колесо
    var i,a;
    for(i=0;i<n;i++){ a=i/n*Math.PI*2;
      var tx=cx+Math.round(Math.cos(a)*r), ty=cy+Math.round(Math.sin(a)*r);
      rp(tx-3,ty-3,6,6,R(3)); rp(tx-3,ty-3,6,2,R(5)); }
    circ(cx,cy,r,R(3)); circ(cx-1,cy-1,r-2,R(4)); circ(cx-2,cy-2,Math.max(1,r-5),R(5));
    circ(cx,cy,Math.max(2,Math.round(r*0.34)),R(1));
    for(i=0;i<6;i++){ a=i/6*Math.PI*2+0.4;
      px(cx+Math.round(Math.cos(a)*(r*0.66)), cy+Math.round(Math.sin(a)*(r*0.66)), R(7)); }
  }
  function spiral(cx,cy,r,R,turns){               // раковина-спираль камерами
    var steps=turns*10, i;
    for(i=steps;i>=0;i--){
      var a=i/10*Math.PI*2*0.5, rr=r*(1-i/steps*0.82);
      var x=cx+Math.round(Math.cos(a)*(r-rr)*0.9), y=cy+Math.round(Math.sin(a)*(r-rr)*0.9);
      circ(x,y,Math.max(1,Math.round(rr)), R(3));
      circ(x-1,y-1,Math.max(1,Math.round(rr)-2), R(4));
      circ(x-2,y-2,Math.max(1,Math.round(rr)-5), R(5));
    }
  }
  function leafFan(cx,cy,r,n,R,spread){           // веер листьев или рёбер
    spread=spread||Math.PI;
    for(var i=0;i<n;i++){
      var a=Math.PI+0.15+(i+0.5)/n*(spread-0.3);
      for(var k=3;k<r;k++){
        var x=cx+Math.round(Math.cos(a)*k), y=cy+Math.round(Math.sin(a)*k*0.95);
        rp(x,y,2,2, (k<r*0.55)?R(4):R(6));
      }
    }
  }
  function stalk(x,yBase,h,R,wob){                // стебель
    for(var k=0;k<h;k++){
      var dx=Math.round(Math.sin(k*0.3)*(wob||0));
      rp(x+dx,yBase-k,3,2,(k%4<2)?R(4):R(5));
    }
  }
  return {orb:orb, ring:ring, rays:rays, box:box, glass:glass, toothed:toothed,
          spiral:spiral, leafFan:leafFan, stalk:stalk};
}

/* ================= РАКУШКИ: находки моря ================= */
function drawShell(c,g,t){
  var S=shp(g), rnd=mulberry32(100+t), cx=43, cy=44, i;
  var P=RA.shell, W=RA.pearl;
  if(t===1){                                       // обломок створки
    g.poly([[cx-12,cy+8],[cx-3,cy-11],[cx+11,cy-4],[cx+8,cy+10]], P(2));
    g.poly([[cx-10,cy+7],[cx-3,cy-9],[cx+9,cy-3],[cx+6,cy+8]], P(3));
    g.poly([[cx-8,cy+5],[cx-3,cy-6],[cx+6,cy-1]], P(4));
    g.poly([[cx-6,cy+2],[cx-2,cy-4],[cx+3,cy-1]], P(5));
    for(i=0;i<5;i++) g.rp(cx-8+i*4,cy-4+i,1,10-i,P(1));
    for(i=0;i<4;i++) g.px(cx-6+i*4,cy+7-i,P(6));
    g.px(cx-4,cy-4,P(7)); g.px(cx+7,cy+2,P(0));
    g.rp(cx-11,cy+7,20,1,P(0));
    g.px(cx+9,cy-4,W(6)); g.px(cx-9,cy+3,W(5));
  }
  if(t===2){                                       // створка
    g.ell(cx,cy,15,12,P(3)); g.ell(cx-2,cy-2,12,9,P(4)); g.ell(cx-3,cy-4,8,5,P(5));
    g.rp(cx-16,cy+8,32,3,P(1)); g.rp(cx-6,cy+6,12,4,P(2)); g.rp(cx-6,cy+6,12,1,P(6));
    S.leafFan(cx,cy+9,15,5,P);
    g.rp(cx-15,cy+1,4,2,P(6)); g.rp(cx+12,cy+1,4,2,P(0));
    for(i=0;i<4;i++) g.px(cx-9+i*6,cy-9,P(7));
    g.px(cx-6,cy-5,W(6)); g.px(cx+5,cy-2,W(4)); g.px(cx-2,cy+3,RA.gold(5));
  }
  if(t===3){                                       // гребешок
    g.ell(cx,cy-1,19,15,P(3)); g.ell(cx-2,cy-3,15,11,P(4));
    S.leafFan(cx,cy+11,20,7,P);
    g.rp(cx-8,cy+9,16,5,P(2)); g.rp(cx-8,cy+9,16,1,P(6));
    g.rp(cx-19,cy+2,4,3,P(5)); g.rp(cx+15,cy+2,4,3,P(1));
    for(i=0;i<8;i++) g.px(cx-17+i*5,cy-13,P(7));
    g.rp(cx-14,cy-6,28,1,P(6)); g.rp(cx-10,cy+4,20,1,P(0));
    g.px(cx-8,cy-8,W(6)); g.px(cx+6,cy-4,W(4)); g.px(cx,cy+6,RA.gold(5));
  }
  if(t===4){                                       // витая раковина
    S.spiral(cx+3,cy+2,19,P,3);
    g.poly([[cx-20,cy+15],[cx-2,cy+2],[cx+3,cy+17]], P(3));
    g.poly([[cx-13,cy+11],[cx-4,cy+5],[cx-1,cy+12]], P(5));
    for(i=0;i<5;i++){ var a=Math.PI*1.15+i*0.28;
      g.rp(cx+3+Math.round(Math.cos(a)*17), cy+2+Math.round(Math.sin(a)*17), 3,3, P(6)); }
    for(i=0;i<4;i++) g.px(cx-8+i*5,cy+10,P(0));
    g.px(cx-2,cy-6,W(7)); g.px(cx+8,cy-2,W(5)); g.px(cx+2,cy+6,RA.gold(5));
    g.rp(cx+14,cy-8,3,2,P(4));
  }
  if(t===5){                                       // жемчужная створка
    g.ell(cx,cy+4,23,15,P(3)); g.ell(cx-2,cy+2,19,12,P(4));
    S.leafFan(cx,cy+16,24,9,P);
    g.ell(cx,cy-10,23,11,P(2)); g.ell(cx-2,cy-11,18,7,P(4));
    S.orb(cx,cy+1,7,W);
    g.rp(cx-20,cy-1,40,2,P(1));
    for(i=0;i<6;i++) g.px(cx-15+i*6,cy-14,W(6));
  }
  if(t===6){                                       // наутилус
    S.spiral(cx,cy,25,P,4);
    for(i=0;i<9;i++){ var b=i/9*Math.PI*2;
      g.rp(cx+Math.round(Math.cos(b)*25)-1, cy+Math.round(Math.sin(b)*25)-1, 3,3, P(1)); }
    for(i=0;i<7;i++){ var d=Math.PI*0.2+i*0.3;

function itemSprite(chain,tier){
  var rg=(typeof S!=='undefined'&&S)?(S.region||0):0;
  if(rg>=SHADOW_PAL.length) rg=0;
  return sprite('it'+rg+'_'+chain+'_'+tier, IS, IS, function(c,g){
    // пятно под предметом: и тень, которой не было, и читаемый ранг ступени
    var pw=Math.round(9+tier*3.1), ph=Math.round(pw*0.34), py=IS-18;
    var PR=SHADOW_PAL[rg][chain];
    g.ell(43,py,pw,ph, PR(1));

    g.ell(43,py-1,Math.round(pw*0.6),Math.max(1,Math.round(ph*0.55)), PR(3));
    for(var q=0;q<4;q++) g.px(43-pw+2+q*Math.round(pw*0.6), py, PR(4));
    if(tier>=7){                                  // высокие ступени светятся снизу
      for(var r=0;r<10;r++){ var a2=(r+0.5)/10*Math.PI;   // только нижняя дуга, внутрь холста
        var gy=py+Math.round(Math.sin(a2)*ph);
        if(gy<IS-3) g.px(43+Math.round(Math.cos(a2)*pw), gy, RA.glass(6)); }

  return (Math.sin(x*0.11)*0.5+Math.sin(y*0.17+1.3)*0.3+Math.sin((x+y)*0.07+2.1)*0.2
        + Math.sin(x*0.31+y*0.13)*0.15)*0.5+0.5;
}

var REGEN_MS=60000;                         // один заряд каждому генератору раз в минуту
function regen(now){
  if(!S) return 0;
  if(typeof now!=='number'||!isFinite(now)) return 0;
  if(!S.regenAt||S.regenAt>now){ S.regenAt=now; return 0; }   // часы уехали назад — просто сбрасываем
  var period=bonusRegenMs();
  var steps=Math.floor((now-S.regenAt)/period);
  if(steps<=0) return 0;
  if(steps>1000) steps=1000;
  S.regenAt+=steps*period;
  var cap=genCap(S.lvl), added=0;
  for(var i=0;i<S.board.length;i++){
    var g=S.board[i];
    if(!g||g.gen===undefined) continue;
    if(g.ch>=cap) continue;
    var before=g.ch;
    g.ch=Math.min(cap, g.ch+steps);
    added+=g.ch-before;
  }
  S.stats.chRegen+=added;
  return added;
}
function msToNextCharge(now){
  var period=bonusRegenMs();

  var left=period-((now-S.regenAt)%period);

}

/* ================= СОБЫТИЕ: ДВЕ НЕДЕЛИ ВЕХ =================
   Идёт по реальному календарю, но НЕ наказывает за отсутствие:
   прогресс не сгорает, пропущенное событие вернётся следующим циклом.
   Никаких «зайди сегодня» — только полоса, которая копится игрой. */
var EVENT_DAYS=14, DAY_MS=86400000;
var EV_NOW=null;                              // подменяемое время для проверок
function evNow(){ return (EV_NOW!==null)?EV_NOW:Date.now(); }
var EVENTS=[
  {id:'saltrun', name:'The Salt Run',
   line:'A convoy is being assembled for the flooded coast. Fill the manifest.',
   steps:[60,150,280,460,700,1000],
   rewards:['+400 coins','Tool','+30 charges','+900 coins','Curiosity','SEASONAL RELIC']},
  {id:'lantern', name:'The Lantern Watch',
   line:'Light the markers along the trench before the current turns.',
   steps:[60,150,280,460,700,1000],
   rewards:['+400 coins','Tool','+30 charges','+900 coins','Curiosity','SEASONAL RELIC']}
];
var SEASONAL={name:'Convoy Bell', note:'Rung to call the salt convoys home. It was recovered from a season when no convoy came, and it still answers when struck.'};
function eventCycle(now){ return Math.floor(now/(EVENT_DAYS*DAY_MS)); }
function eventIdx(now){ return eventCycle(now)%EVENTS.length; }
function eventNow(now){ return EVENTS[eventIdx(now)]; }
function eventEndsIn(now){
  var per=EVENT_DAYS*DAY_MS;
  return per-(now%per);
}
function eventSync(now){
  if(!S) return;
  var cyc=eventCycle((now===undefined||now===null)?evNow():now);
  if(S.evCycle!==cyc){                        // новый цикл: полоса начинается заново
    S.evCycle=cyc; S.evPts=0; S.evStep=0;
  }
}
function eventAdd(v, now){
  if(!S) return;
  var t=(now===undefined||now===null)?evNow():now;
  eventSync(t);
  var ev=eventNow(t);
  S.evPts=(S.evPts||0)+v;
  var guard=0;
  while(S.evStep<ev.steps.length && S.evPts>=ev.steps[S.evStep] && guard++<20){
    var step=S.evStep;
    S.evStep++;
    grantEvent(step, ev);
  }
}
function grantEvent(step, ev){
  var i;
  if(step===0){ S.coins+=400; S.stats.coinsIn+=400; toast('Event: +400 coins'); }
  else if(step===1){ var f=freeCell();
    if(f>=0){ S.board[f]={c:4,t:2}; toast('Event: a Tool'); }
    else { S.coins+=200; toast('Event: board full, +200 coins'); } }
  else if(step===2){ var cap=genCap(S.lvl), left=30;
    for(i=0;i<S.board.length&&left>0;i++){ var g=S.board[i];
      if(g&&g.gen!==undefined&&g.ch<cap){ var add=Math.min(left,cap-g.ch); g.ch+=add; left-=add; } }
    toast('Event: charges topped up'); }
  else if(step===3){ S.coins+=900; S.stats.coinsIn+=900; toast('Event: +900 coins'); }
  else if(step===4){ findCurio('event'); }
  else if(step===5){
    if(!S.seasonal){ S.seasonal=1; S.stats.seasonal=1; S.curioOpen=-2;
      toast('SEASONAL RELIC: '+SEASONAL.name); }
    else { S.coins+=2000; S.stats.coinsIn+=2000; toast('Event complete: +2000 coins'); }
  }
}
function eventProgress(){
  var ev=eventNow(evNow());
  var step=Math.min(S.evStep||0, ev.steps.length-1);
  var need=ev.steps[step];
  var prev=(S.evStep>0)?ev.steps[S.evStep-1]:0;
  var done=(S.evStep>=ev.steps.length);
  return {ev:ev, step:S.evStep||0, need:need, prev:prev, pts:S.evPts||0, done:done};
}

/* ================= ЭКСПЕДИЦИОННЫЙ ФОНД =================
   Бесконечная покупка за растущую цену. Монетам всегда есть куда деваться,
   но выгода падает — это слив излишка, а не обходной путь. */
var FUND_BASE=600;
function fundPrice(){ return Math.round(FUND_BASE*Math.pow(1.35,(S&&S.fundLevel)||0)); }
function fundExpPts(){ return 40+((S&&S.fundLevel)||0)*6; }
function fundScore(){ return 30+((S&&S.fundLevel)||0)*5; }
function buyFund(){
  var price=fundPrice();
  if(S.coins<price){ toast('Not enough coins'); return false; }
  S.coins-=price; S.stats.coinsOut+=price;
  S.fundLevel=(S.fundLevel||0)+1;
  S.stats.fundBought=(S.stats.fundBought||0)+1;
  expAdd(fundExpPts());
  toast('Expedition funded \u2014 supplies sent down');
  return true;
}

/* ================= ПОЛОСА ЭКСПЕДИЦИИ =================
   Копится ТОЛЬКО от игры: слияния, сдачи, погружения. Ни календаря,
   ни наказания за отсутствие. Вехи не кончаются — порог растёт. */
var EXP_REWARDS=[
  {t:'coins', n:120,  label:'+120 coins'},
  {t:'tool',  n:2,    label:'Tool'},
  {t:'charge',n:14,   label:'+14 charges'},
  {t:'curio', n:1,    label:'Curiosity'},
  {t:'coins', n:400,  label:'+400 coins'},
  {t:'tool',  n:3,    label:'Better tool'},
  {t:'charge',n:26,   label:'+26 charges'},
  {t:'curio', n:1,    label:'Curiosity'}
];
function expNeed(step){ return 90+step*45; }    // порог растёт: 90, 135, 180 ...
function expReward(step){ return EXP_REWARDS[step%EXP_REWARDS.length]; }
function expAdd(v){
  if(!S) return;
  eventAdd(v);
  S.expPts=(S.expPts||0)+v;
  S.stats.expPts=(S.stats.expPts||0)+v;
  var guard=0;
  while(S.expPts>=expNeed(S.expStep||0) && guard++<50){
    S.expPts-=expNeed(S.expStep||0);
    var r=expReward(S.expStep||0);
    S.expStep=(S.expStep||0)+1;
    grantExp(r);
  }
}
function grantExp(r){
  var i;
  if(r.t==='coins'){ S.coins+=r.n; S.stats.coinsIn+=r.n; toast('Expedition: +'+r.n+' coins'); }
  else if(r.t==='tool'){
    var f=freeCell();
    if(f>=0){ S.board[f]={c:4,t:Math.min(r.n,A_CHAINS[4].max)}; toast('Expedition: a Tool'); }
    else { S.coins+=150; toast('Expedition: board full, +150 coins'); }
  }
  else if(r.t==='charge'){
    var cap=genCap(S.lvl), left=r.n;
    for(i=0;i<S.board.length&&left>0;i++){ var g=S.board[i];
      if(g&&g.gen!==undefined&&g.ch<cap){ var add=Math.min(left, cap-g.ch); g.ch+=add; left-=add;
        S.stats.chExp=(S.stats.chExp||0)+add; } }
    toast('Expedition: charges topped up');
  }
  else if(r.t==='curio'){ findCurio('expedition'); }
}

/* ================= ПОГРУЖЕНИЕ (герой) ================= */
var TOOL_DROP=0.035;                        // 3.5% шанс инструмента с каждого слияния
var DIVE_MIN=6;                             // находки: с шестой ступени
var DIVE_TOOL_MIN=3;                        // инструменты: с третьей                                   // ниже этой ступени снаряжения не хватает
function diveSite(){ return Math.min(S.chapter, A_CHAPTERS.length-1); }
function relicsLeftAt(site){
  var n=0;
  for(var i=0;i<A_RELICS.length;i++) if(A_RELICS[i].site===site && S.relics[i]===0) n++;
  return n;
}
function siteUnlocked(site){ return site<=S.chapter; }        // открыто ровно до текущей главы
function relicsAvailable(){
  var n=0;
  for(var i=0;i<A_RELICS.length;i++) if(S.relics[i]===0 && siteUnlocked(A_RELICS[i].site)) n++;
  return n;
}
function nextRelic(site){                     // сперва текущий объект, потом любой открытый
  var i;
  for(i=0;i<A_RELICS.length;i++) if(A_RELICS[i].site===site && S.relics[i]===0) return i;
  for(i=0;i<A_RELICS.length;i++) if(S.relics[i]===0 && siteUnlocked(A_RELICS[i].site)) return i;
  return -1;
}
/* Снаряжение бывает двух видов:
   инструмент (своя цепочка, не спорит с главой) и крупная находка.
   Ступень снаряжения приводится к общей шкале: 1 = полчаса под водой. */
function diveGrade(c,t){
  var g=(c===4)? (t-2) : (t-6);
  return g<1?1:g;
}
function diveDurationBase(c,t){
  return 30000 + (diveGrade(c,t)-1)*15000;
}
function diveDuration(c,t){
  if(t===undefined){ t=c; c=0; }             // старая подпись: считаем как находку
  return Math.round(diveDurationBase(c,t)*(S?bonusDiveFactor():1));
}
function diveBusy(){ return !!S.dive; }
function diveReady(it){
  if(!it||it.gen!==undefined) return false;
  return (it.c===4)? (it.t>=DIVE_TOOL_MIN) : (it.t>=DIVE_MIN);
}
function canDive(it){ return diveReady(it) && !diveBusy(); }
function diveLeft(now){
  if(!S.dive) return 0;
  var left=S.dive.endAt-now;
  return (left>0)?left:0;
}
function dive(cellIdx, now){
  var it=S.board[cellIdx];
  if(diveBusy()){ toast('The diver is already down there'); return false; }
  if(!diveReady(it)){
    toast('Send a Tool (tier '+DIVE_TOOL_MIN+'+) or a big find (tier '+DIVE_MIN+'+)'); return false; }
  if(typeof now!=='number'||!isFinite(now)) now=Date.now();
  S.board[cellIdx]=null;
  var dur=diveDuration(it.c,it.t);
  S.dive={c:it.c, t:it.t, top:((it.t>=A_CHAINS[it.c].max)||diveGrade(it.c,it.t)>=5)?1:0, endAt:now+dur, dur:dur};
  S.stats.dives++;
  expAdd(20);
  toast('The diver descends with '+A_TIERS[it.c][it.t-1]+' — back in '+Math.round(dur/1000)+'s');
  return true;
}
function collectDive(now){                     // возвращение: только здесь начисляются награды
  if(!S.dive) return false;
  if(typeof now!=='number'||!isFinite(now)) return false;
  if(S.dive.endAt-now>S.dive.dur) S.dive.endAt=now+S.dive.dur;   // часы уехали вперёд
  if(now<S.dive.endAt) return false;
  var d=S.dive, site=diveSite(), k=nextRelic(site);
  S.dive=null;
  var firstEver=(S.stats.relics===0);
  var success=(k>=0)&&(d.top||firstEver||rndGame()<bonusRelicChance());
  var dcoin=Math.round(itemValue(d.c,d.t)*(d.top?1.4:0.8)*bonusCoinFactor());
  S.coins+=dcoin; S.stats.coinsIn+=dcoin;
  addXP(d.t*2);
  if(success){
    S.relics[k]=1; S.stats.relics++;   // сразу становится экспонатом музея
    S.relicOpen=k;
    toast('RELIC RECOVERED: '+A_RELICS[k].name);
  } else if(k<0){
    S.coins+=300+S.chapter*150;
    toast('Nothing left at this site — salvage sold');
  } else {
    var ft=freeCell();
    if(ft>=0){ S.board[ft]={c:4,t:2}; toast('No relic — but the diver salvaged a Tool'); }
    else toast('No relic this time. The gear is spent.');
  }
  return true;
}

/* ================= БОКОВОЙ ЗАКАЗ ================= */
function chapterChains(){                       // цепочки, занятые текущей главой
  var out={}, ch, i;
  if(chapterDone()) return out;
  ch=chapter();
  for(i=0;i<ch.req.length;i++) if((S.chapReq[i]||0)<ch.req[i].n) out[ch.req[i].c]=1;
  return out;
}
function newOrder(){
  var maxC=unlockedGens(S.lvl), busy=chapterChains(), free=[], i;
  for(i=0;i<maxC;i++) if(!busy[i]) free.push(i);        // заказ по свободной цепочке
  var pool=free.length?free:[];
  for(i=0;i<maxC&&!pool.length;i++) pool.push(i);
  for(i=0;i<maxC;i++) pool.push(i);                    // занятые цепочки тоже годятся
  var c=pool[Math.floor(rndGame()*pool.length)];
  // заказы короткие: две-четыре ступени, редко пять — их надо закрывать за минуты
  var hi=Math.min(A_CHAINS[c].max-1, 3+Math.floor(S.lvl/4));
  var t=2+Math.floor(rndGame()*Math.max(1,hi-1));
  if(busy[c]){                                          // по занятой цепочке просим НИЖЕ цели
    var lim=99, ch2=chapter(), q2;
    for(q2=0;q2<ch2.req.length;q2++)
      if(ch2.req[q2].c===c && (S.chapReq[q2]||0)<ch2.req[q2].n)
        lim=Math.min(lim, ch2.req[q2].t-3);
    if(lim<2) lim=2;
    t=Math.min(t, lim);
  }
  t=Math.min(t, A_CHAINS[c].max);
  var n=(t<=3)?(1+Math.floor(rndGame()*2)):1;
  return {c:c, t:t, n:n, got:0, coin:Math.round(itemValue(c,t)*n*2.0)+20, xp:Math.round(t*n*3)};
}
var CARD_SLOTS=4;
function openReqs(){                            // требования главы, ещё не закрытые
  var out=[], ch, i;
  if(chapterDone()) return out;
  ch=chapter();
  for(i=0;i<ch.req.length;i++) if((S.chapReq[i]||0)<ch.req[i].n) out.push(i);
  return out;
}
function fillOrder(){                           // добиваем строку заказами до четырёх карточек
  if(!S.orders) S.orders=[];
  var need=CARD_SLOTS-openReqs().length;
  if(need<1) need=1;                            // хотя бы один заказ всегда доступен
  while(S.orders.length<need) S.orders.push(newOrder());
  while(S.orders.length>CARD_SLOTS) S.orders.pop();
}
function cardSlots(){                           // что показывать в четырёх слотах
  var out=[], reqs=openReqs(), i;
  for(i=0;i<reqs.length&&out.length<CARD_SLOTS;i++) out.push({type:'chap', idx:reqs[i]});
  for(i=0;i<S.orders.length&&out.length<CARD_SLOTS;i++) out.push({type:'order', idx:i});
  return out;
}
function deliverToOrder(cellIdx, oi){
  oi=oi||0;
  var q=S.orders[oi], it=S.board[cellIdx];
  if(!q||!it||it.gen!==undefined) return false;
  if(it.c!==q.c||it.t!==q.t) return false;
  S.board[cellIdx]=null; q.got++;
  if(q.got>=q.n){
    S.coins+=q.coin; S.stats.coinsIn+=q.coin; addXP(q.xp); S.ordersDone++; expAdd(10);
    toast('+'+q.coin+' coins');
    if(S.ordersDone%2===0) giveTool();
    S.orders.splice(oi,1); fillOrder();
  } else toast(q.got+'/'+q.n);
  return true;
}
function giveTool(){
  var f=freeCell();
  if(f<0){ S.coins+=40; toast('Board full: +40 coins'); return; }
  S.board[f]={c:4, t:1+Math.floor(rndGame()*2)};
  toast('Tool received');
}

/* ================= УРОВЕНЬ ================= */
function addXP(v){
  S.xp+=v;
  while(S.xp>=xpNeed(S.lvl)){
    S.xp-=xpNeed(S.lvl); S.lvl++; S.coins+=S.lvl*15;
    toast('LEVEL '+S.lvl);
    placeGenerators();
    for(var i=0;i<S.board.length;i++){ var b=S.board[i];
      if(b&&b.gen!==undefined) b.ch=Math.min(genCap(S.lvl), b.ch+10); }
  }
  if(S.lvl>999) S.lvl=999;
}

/* ================= ДОСКА ================= */
function tapGenerator(i){
  var b=S.board[i];
  if(!b||b.gen===undefined) return false;
  if(b.ch<=0){ toast('Out of charges — merge tier 4+, use a Tool, or wait for the tide'); return false; }
  var f=freeCell();
  if(f<0){ toast('No space'); return false; }
  b.ch--;
  S.stats.chSpent++;
  S.board[f]={c:b.gen, t:Math.min(spawnTier(S.lvl), A_CHAINS[b.gen].max)};
  S.stats.spawns++;
  if(S.tip===0){ S.tip=1; }
  return true;
}
function tryMerge(from, to){
  var a=S.board[from], b=S.board[to];
  if(!a||!b||from===to) return false;
  if(a.gen!==undefined) return false;
  if(b.gen!==undefined){
    if(a.c===4){                                  // инструмент — доливка, а не полный бак
      var capL=genCap(S.lvl);
      var add=Math.min(Math.round(capL*0.5), Math.max(3, Math.round(capL*(0.15+0.07*a.t))));
      b.ch=Math.min(capL, b.ch+add); S.stats.chTools+=add; S.board[from]=null;
      toast('+'+add+' charges'); if(S.tip===3) S.tip=4; return true; }
    return false;
  }
  if(a.c!==b.c||a.t!==b.t) return false;
  if(a.t>=A_CHAINS[a.c].max){ toast('Top tier — send it down with the diver'); return false; }
  S.board[from]=null;
  S.board[to]={c:a.c, t:a.t+1};
  S.stats.merges++;
  if(a.t+1>=A_CHAINS[a.c].max) S.stats.topTier=(S.stats.topTier||0)+1;
  addXP(Math.ceil(a.t/2));
  expAdd(1+Math.floor(a.t/2));                  // полоса экспедиции копится игрой
  if(a.t>=5 && rndGame()<0.05) findCurio('merge');   // мелкая находка со дна
  if(S.tip===1) S.tip=2;
  if(a.t>=4){                                    // мелкий мерж больше не заправляет генератор
    S.stats.mergeHi++;
    for(var gi=0;gi<S.board.length;gi++){
      var gb=S.board[gi];
      if(gb&&gb.gen===a.c){
        var was=gb.ch;
        gb.ch=Math.min(genCap(S.lvl), gb.ch+(a.t-3));
        S.stats.chMerge+=gb.ch-was;              // третий источник зарядов, теперь виден
        break;
      }
    }
  }
  if(a.t>=4) S.coins+=a.t*2;
  if(rndGame()<TOOL_DROP){                       // редкая находка снасти при слиянии
    var ft=freeCell();
    if(ft>=0){
      var tt=(a.t+1>=8)?2:1;                     // глубокое слияние — инструмент получше
      S.board[ft]={c:4, t:Math.min(tt, A_CHAINS[4].max)};
      S.stats.toolsFound++;
      toast('A Tool came up with it');
    }
  }
  return true;
}
function moveItem(from,to){
  if(from===to) return false;
  var a=S.board[from];
  if(!a) return false;
  if(a.gen!==undefined) return false;
  if(!S.board[to]){ S.board[to]=a; S.board[from]=null; return true; }
  if(tryMerge(from,to)) return true;
  if(S.board[to].gen!==undefined) return false;
  var b=S.board[to]; S.board[to]=a; S.board[from]=b;
  return true;
}
function sellItem(i){
  var it=S.board[i];
  if(!it||it.gen!==undefined) return false;
  var v=itemValue(it.c,it.t);
  S.coins+=v; S.stats.coinsIn+=v; S.board[i]=null; S.stats.sold++;
  toast('+'+v+' coins');
  return true;
}

/* ================= ГОРОД: ДЕКОР И ЭКСПОНАТЫ ================= */
function buyDecor(k){
  var d=A_DECOR[k];
  if(!d) return false;
  if(S.coins<d.price){ toast('Not enough coins'); return false; }
  S.coins-=d.price; S.stats.coinsOut+=d.price; S.owned[k]++;
  toast('Bought: '+d.name);
  return true;
}
function attachToPlot(site, k){                 // в город идёт ТОЛЬКО интерьер за монеты
  if(site<0||site>=S.plots.length) return false;
  if(!S.built[site]){ toast('Restore this site first'); return false; }
  if(S.plots[site].length>=4){ toast('No room at this site'); return false; }
  for(var q=0;q<S.plots[site].length;q++)
    if(S.plots[site][q].k===k){ toast('Already standing here — pick something else'); return false; }
  if(!S.owned[k]) return false;
  var beforeSets=setsAt(site);
  S.owned[k]--;
  S.plots[site].push({kind:'dec', k:k});
  var before=beforeSets, after=setsAt(site);
  if(after.length>before.length)
    toast('ENSEMBLE COMPLETE: '+A_SETS[after[after.length-1]].name);
  else
    toast(A_DECOR[k].name+' placed — '+A_SITE[site].what+' +'+siteBonusText(site)+'%');
  return true;
}
function detachFromPlot(site, i){
  var p=S.plots[site];
  if(!p||!p[i]) return false;
  S.owned[p[i].k]++;
  p.splice(i,1);
  return true;
}
function siteDecor(i){                         // сколько предметов интерьера стоит на объекте
  var p=S.plots[i]; return p?p.length:0;
}
function setsAt(site){                          // какие ансамбли собраны на площадке
  var p=S.plots[site], out=[], si, j, k;
  if(!p) return out;
  var have={};
  for(j=0;j<p.length;j++) have[p[j].k]=1;
  for(si=0;si<A_SETS.length;si++){
    var all=true;
    for(k=0;k<A_SETS[si].items.length;k++) if(!have[A_SETS[si].items[k]]) all=false;
    if(all) out.push(si);
  }
  return out;
}
function setBonusTenths(site){
  var s=setsAt(site), n=0;
  for(var j=0;j<s.length;j++) n+=A_SETS[s[j]].bon;
  return n;
}
function siteBonusTenths(i){                    // вклады вещей плюс собранные ансамбли
  var p=S.plots[i], s=0;
  if(!p) return 0;
  for(var j=0;j<p.length;j++) s+=A_DECOR[p[j].k].bon;
  s+=setBonusTenths(i);
  return Math.min(SITE_BONUS_CAP, s);
}
function siteBonus(i){ return siteBonusTenths(i)/10; }        // в процентах, дробью
function siteBonusText(i){ return (siteBonusTenths(i)/10).toFixed(1); }

      for(q5=0;q5<cur2.length;q5++) slot.curios[q5]=(Array.isArray(src2.curios)&&(+src2.curios[q5])>0)?1:0;
      slot.owned=[];
      for(q5=0;q5<dec2.length;q5++)
        slot.owned[q5]=Math.max(0,Math.min(999,(Array.isArray(src2.owned)?(+src2.owned[q5]):0)||0));
      slot.plots=[[],[],[],[],[],[]];
      if(Array.isArray(src2.plots)) for(q5=0;q5<6;q5++){
        var pl2=src2.plots[q5];
        if(!Array.isArray(pl2)) continue;
        for(var q6=0;q6<pl2.length&&q6<4;q6++){
          var e5=pl2[q6];
          if(!e5||typeof e5!=='object'||e5.kind==='rel') continue;
          slot.plots[q5].push({kind:'dec', k:Math.max(0,Math.min(Math.max(0,dec2.length-1),(+e5.k)||0))});
        }
      }
      slot.board=new Array(COLS*ROWS).fill(null);
      if(Array.isArray(src2.board)&&src2.board.length===COLS*ROWS){
        var chn2=reg2.chains||[];
        for(q5=0;q5<src2.board.length;q5++){
          var cc2=src2.board[q5];
          if(!cc2||typeof cc2!=='object'){ slot.board[q5]=null; continue; }
          if(cc2.gen!==undefined)
            slot.board[q5]={gen:Math.max(0,Math.min(Math.max(0,chn2.length-1),(+cc2.gen)||0)),
                            ch:Math.max(0,Math.min(150,(+cc2.ch)||0))};
          else {
            var ci2=Math.max(0,Math.min(Math.max(0,chn2.length-1),(+cc2.c)||0));
            slot.board[q5]={c:ci2, t:Math.max(1,Math.min(chn2[ci2]?chn2[ci2].max:10,(+cc2.t)||1))};
          }
        }
      }
      slot.orders=[];
      if(Array.isArray(src2.orders)) for(q5=0;q5<src2.orders.length&&q5<4;q5++){
        var so2=sanOrder(src2.orders[q5]); if(so2) slot.orders.push(so2);
      }
      b.byRegion[ri]=slot;
    }
  }
  if(!b.achs) b.achs=[];
  if(Array.isArray(o.achs)) for(i=0;i<ACHS.length;i++) b.achs[i]=o.achs[i]?1:0;
  if(!b.achQueue) b.achQueue=[];
  if(o.sayShown&&typeof o.sayShown==='object'){
    for(var sk in o.sayShown) if(/^\d+_[01]$/.test(sk)) b.sayShown[sk]=1;
  }
  if(Array.isArray(o.owned)) for(i=0;i<b.owned.length;i++) b.owned[i]=Math.max(0,Math.min(999,(+o.owned[i])||0));
  if(Array.isArray(o.plots)){
    for(i=0;i<6;i++){
      var src=o.plots[i]; b.plots[i]=[];
      if(!Array.isArray(src)) continue;
      for(j=0;j<src.length&&j<4;j++){
        var e=src[j]; if(!e||typeof e!=='object') continue;
        if(e.kind==='rel'){                          // старый сейв: реликвия уезжает в музей
          var rk=Math.max(0,Math.min(Math.max(0,SREL.length-1),(+e.k)||0));
          b.relics[rk]=1; continue;
        }
        b.plots[i].push({kind:'dec', k:Math.max(0,Math.min(Math.max(0,SDEC.length-1),(+e.k)||0))});
      }
    }
  }
  function sanOrder(o2){
    if(!o2||typeof o2!=='object') return null;
    var oc=Math.max(0,Math.min(Math.max(0,SCH.length-1),(+o2.c)||0));
    return {c:oc, t:Math.max(1,Math.min((SCH[oc]?SCH[oc].max:10),(+o2.t)||1)),
      n:Math.max(1,Math.min(9,(+o2.n)||1)), got:Math.max(0,Math.min(9,(+o2.got)||0)),
      coin:Math.max(0,Math.min(999999,(+o2.coin)||10)), xp:Math.max(0,Math.min(9999,(+o2.xp)||4))};
  }
  if(Array.isArray(o.orders)){
    for(i=0;i<o.orders.length&&b.orders.length<4;i++){
      var so=sanOrder(o.orders[i]); if(so) b.orders.push(so);
    }
  } else if(o.order){                            // сейв прошлых версий: один заказ
    var so1=sanOrder(o.order); if(so1) b.orders.push(so1);
  }
  return b;
}

function importSave(str){
  var o=null;

  if(!o||typeof o!=='object') return false;
  S=sanitize(o);
  placeGenerators(); fillOrder(); save();

function load(){
  var raw=null, from='';
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){                                     // сейв прошлых версий обязан подхватиться
    for(var i=0;i<OLD_KEYS.length;i++){
      var old=null;
      try{ old=localStorage.getItem(OLD_KEYS[i]); }catch(e){}
      if(old){ raw=old; from=OLD_KEYS[i]; break; }
    }
  }
  if(!raw){ S=baseState(); }
  else {
    var o=null; try{ o=JSON.parse(raw); }catch(e){ o=null; }
    S=sanitize(o);
    if(from){ MIGRATED_FROM=from; save(); toast('Progress carried over from an older version'); }
  }
  applyRegion();
  placeGenerators(); fillOrder();
  giveStarterGift();
  speak(S.chapter,0);
}

function travelTo(i){
  if(i===S.region) return false;
  if(!regionUnlocked(i)||!REGIONS[i]||!REGIONS[i].chapters) return false;
  save();
  if(!S.byRegion) S.byRegion={};
  S.byRegion[S.region]={chapter:S.chapter, chapReq:S.chapReq, built:S.built,
    relics:S.relics, curios:S.curios, owned:S.owned, plots:S.plots,
    board:S.board, orders:S.orders};
  S.region=i;
  applyRegion();
  var st=S.byRegion[i];
  var fresh=baseState();
  S.chapter=st?st.chapter:0;
  S.chapReq=st?st.chapReq:[0,0,0];
  S.built=st?st.built:fresh.built;
  S.relics=st?st.relics:fresh.relics;
  S.curios=st?st.curios:fresh.curios;
  S.owned=st?st.owned:fresh.owned;

  S.orders=st?st.orders:[];
  S.detail=-1; S.say=null; S.storyOpen=-1; S.relicOpen=-1; S.curioOpen=-1;

}

var AC=null, MG=null, musicStep=0, lastMusic=0;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended'&&AC.resume){ try{ var p=AC.resume(); if(p&&p.then) p.then(function(){},function(){}); }catch(e){} } return; }
  try{
    var Ctor=window.AudioContext||window.webkitAudioContext;
    if(!Ctor) return;
    AC=new Ctor();
    MG=AC.createGain(); MG.gain.value=0.85; MG.connect(AC.destination);
    if(AC.state==='suspended'&&AC.resume){ var q=AC.resume(); if(q&&q.then) q.then(function(){},function(){}); }
  }catch(e){ AC=null; }
}
function note(freq,dur,gain,type){
  if(!AC||S.mute) return;
  try{
    var t=AC.currentTime, o1=AC.createOscillator(), o2=AC.createOscillator();
    var f=AC.createBiquadFilter(), g=AC.createGain();
    o1.type=type||'triangle'; o2.type=type||'triangle';
    o1.frequency.value=freq; o2.frequency.value=freq*1.006;
    f.type='lowpass'; f.frequency.value=2600;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime((gain||0.16)*1.9,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(MG);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.02); o2.stop(t+dur+0.02);
  }catch(e){}
}
var MUSIC_STEP_MS=320;                          // вдвое чаще прежнего — партия живее
/* Чистая функция расписания: и играет в браузере, и рендерится в WAV (раздел 5).
   Слои: бас — пад — арпеджио — колокол — «пузырьки». Громкость дышит по 16 шагов. */
function musicSalt(step){                        // второй город: ниже, суше, миксолидийский
  var out=[], root=138.59, sc=[0,2,4,5,7,9,10,12,14,16];
  function f(s,o){ return root*Math.pow(2,s/12)*Math.pow(2,o||0); }
  var bar=Math.floor(step/8), inBar=step%8;
  var breath=0.70+0.30*Math.sin(step/16*Math.PI);
  var deg=(bar*2)%sc.length;
  if(inBar===0) out.push({f:f(sc[deg],-1), d:3.2, g:0.08*breath, w:'sine'});
  if(inBar===4) out.push({f:f(sc[(deg+3)%sc.length],-1), d:2.6, g:0.055*breath, w:'sine'});
  if(inBar===0||inBar===4){
    out.push({f:f(sc[deg]), d:3.6, g:0.05*breath, w:'triangle'});
    out.push({f:f(sc[(deg+4)%sc.length]), d:3.4, g:0.04*breath, w:'triangle'});
  }
  var arp=[0,3,5,3,6,5,3,2][inBar];
  out.push({f:f(sc[(deg+arp)%sc.length],1), d:0.6, g:0.06*breath, w:'sine'});
  if(inBar%2===0) out.push({f:f(sc[(deg+arp+3)%sc.length],1), d:0.45, g:0.038*breath, w:'sine'});
  if(step%6===0) out.push({f:f(sc[(bar+inBar)%sc.length],2), d:1.7, g:0.045*breath, w:'sine'});
  if(inBar===3||inBar===7) out.push({f:f(sc[(deg+5)%sc.length],2), d:0.2, g:0.028*breath, w:'sine'});
  if(step%32===31) out.push({f:f(sc[0],2), d:2.8, g:0.042*breath, w:'triangle'});
  return out;
}
function musicEvents(step, mode){
  var out=[];
  if(mode==='saltworks')
    return musicSalt(step);
  var M=(mode==='city')
    ? {root:174.61, sc:[0,2,4,7,9,11,12,14,16], sw:5, bell:[12,16,19]}     // город: светлее
    : (mode==='museum')
      ? {root:130.81, sc:[0,3,5,7,10,12,15,17,19], sw:7, bell:[12,15,19]}  // музей: ниже и тише
      : {root:146.83, sc:[0,2,3,5,7,9,10,12,14,17], sw:6, bell:[12,14,17]};// доска: дорийский
  function f(semi, oct){ return M.root*Math.pow(2, semi/12)*Math.pow(2, oct||0); }
  var bar=Math.floor(step/8), inBar=step%8;
  var breath=0.72+0.28*Math.sin(step/16*Math.PI);        // дыхание громкости
  var deg=(bar*3)%M.sc.length;                            // медленно едущая гармония

  if(inBar===0) out.push({f:f(M.sc[deg],-1), d:3.0, g:0.075*breath, w:'sine'});      // бас
  if(inBar===4) out.push({f:f(M.sc[(deg+2)%M.sc.length],-1), d:2.4, g:0.055*breath, w:'sine'});
  if(inBar===0||inBar===4){                                                           // пад в терцию
    out.push({f:f(M.sc[deg]), d:3.4, g:0.05*breath, w:'triangle'});
    out.push({f:f(M.sc[(deg+2)%M.sc.length]), d:3.2, g:0.042*breath, w:'triangle'});
  }
  var arp=[0,2,4,2,5,4,2,1][inBar];                                                   // арпеджио
  out.push({f:f(M.sc[(deg+arp)%M.sc.length], 1), d:0.55, g:0.062*breath, w:'sine'});
  if(inBar%2===1)
    out.push({f:f(M.sc[(deg+arp+2)%M.sc.length], 1), d:0.42, g:0.04*breath, w:'sine'});
  if((step+M.sw)%M.sw===0)                                                            // колокол
    out.push({f:f(M.bell[(bar+inBar)%M.bell.length], 2), d:1.9, g:0.05*breath, w:'sine'});
  if(inBar===2||inBar===6)                                                            // «пузырьки»
    out.push({f:f(M.sc[(deg+4)%M.sc.length], 2), d:0.22, g:0.03*breath, w:'sine'});
  if(step%32===31)                                                                    // вздох в конце фразы
    out.push({f:f(M.sc[0], 2), d:2.6, g:0.045*breath, w:'triangle'});
  return out;
}
function musicTick(now){
  if(!AC||S.mute) return;
  ensureAmbient();
  ambientLevel(S.screen==='game'?0.16:0.09);
  if(now-lastMusic<MUSIC_STEP_MS) return;
  lastMusic=now;
  var mode=(S.screen==='city')?'city':((S.screen==='museum')?'museum':
    ((region().musicMode==='saltworks')?'saltworks':'game'));
  var ev=musicEvents(musicStep++, mode);
  for(var i=0;i<ev.length;i++) note(ev[i].f, ev[i].d, ev[i].g, ev[i].w||'sine');
}
var AMB=null;
function ensureAmbient(){                        // ровный шум воды под всем остальным
  if(!AC||AMB||S.mute) return;
  try{
    var len=Math.floor(AC.sampleRate*2), buf=AC.createBuffer(1,len,AC.sampleRate);
    var d=buf.getChannelData(0), last=0;
    for(var i=0;i<len;i++){                       // мягкий розоватый шум
      var w=(Math.random()*2-1);
      last=(last*0.96)+(w*0.04); d[i]=last*3.2;
    }
    var src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
    var g2=AC.createGain(); g2.gain.value=0.16;
    var lfo=AC.createOscillator(), lg=AC.createGain();
    lfo.frequency.value=0.07; lg.gain.value=0.05;
    lfo.connect(lg); lg.connect(g2.gain);
    src.connect(f); f.connect(g2); g2.connect(MG);
    src.start(); lfo.start();
    AMB={src:src, gain:g2, lfo:lfo};
  }catch(e){ AMB=null; }
}
function ambientLevel(v){
  if(!AMB) return;
  try{ AMB.gain.gain.value=v; }catch(e){}
}

function sfxMerge(t){                            // короткий подъём: чем выше ступень, тем выше тон

    var y=248-Math.round(slide*slide*160);
    var fade=(p>0.88)?Math.max(0,(1-p)/0.12):1;
    g.globalAlpha=fade;
    for(var r=0;r<20;r++){                       // лучи из-за ленты
      var ang=r/20*Math.PI*2+f.t*0.5;

        g.fillRect((VW/2+Math.cos(ang)*d)|0, (y+34+Math.sin(ang)*d*0.55)|0, 3,3);

    text(g, a.desc, 270, y+72, 12, '#e8dcb8','center');
    for(var s=0;s<26;s++){                       // золотая пыль вдоль ленты
      var sx=44+((s*97+Math.floor(f.t*70))%452);
      var sy=y+6+((s*53)%76);
      var tw=0.5+0.5*Math.sin(f.t*6+s);
      g.globalAlpha=fade*tw*0.85;
      g.fillStyle=(s%3)?'#ffe9a8':'#ffffff';
      g.fillRect(sx,sy,2,2);

    g.globalAlpha=1;

function drawFX(g){
  for(var i=0;i<FX.length;i++){
    var f=FX[i], p=f.t/f.life, e=1-Math.pow(1-p,2);
    g.globalAlpha=Math.max(0,1-p);
    if(f.ty==='merge'){
      var r=Math.round(10+e*36);                 // расходящееся кольцо
      for(var k=0;k<14;k++){ var a=k/14*Math.PI*2;
        g.fillStyle=f.c;
        g.fillRect((f.x+Math.cos(a)*r)|0, (f.y+Math.sin(a)*r)|0, 3,3); }
      var s=Math.round(6+(1-e)*10);              // вспышка в центре
      g.fillStyle='#ffffff'; g.fillRect((f.x-s/2)|0,(f.y-s/2)|0,s,s);
    }
    if(f.ty==='big'){
      var R=Math.round(14+e*74);
      for(var q=0;q<3;q++){                      // три кольца вразнобой
        var rr=R-q*13; if(rr<4) continue;
        for(var m=0;m<24;m++){ var b=m/24*Math.PI*2+q*0.3;
          g.fillStyle=(q===0)?'#ffffff':f.c;
          g.fillRect((f.x+Math.cos(b)*rr)|0,(f.y+Math.sin(b)*rr)|0,4,4); }
      }
      for(var n=0;n<12;n++){                     // лучи
        var c2=n/12*Math.PI*2, r0=Math.round(12+e*20), r1=Math.round(30+e*54);
        for(var d=r0;d<r1;d+=3){
          g.fillStyle=f.c;
          g.fillRect((f.x+Math.cos(c2)*d)|0,(f.y+Math.sin(c2)*d)|0,3,3); }
      }
      g.globalAlpha=Math.max(0,(1-p)*0.5);       // вспышка на весь экран
      g.fillStyle='#eafcff'; g.fillRect(0,HUD_H,VW,BOARD_B-HUD_H);
    }
    g.globalAlpha=1;
  }
}

function wrap(g,str,x,y,size,col,maxChars,lineH){
  var words=String(str).split(' '), line='', ly=y, i;

    if(tst.length>maxChars){ text(g,line,x,ly,size,col); line=words[i]; ly+=lineH; }

    if(SHAKE.cell===i&&SHAKE.t>0) pos.x+=Math.round(Math.sin(SHAKE.t*60)*4);
    var io=(CELL-IS)/2;                       // спрайт крупнее клетки — центрируем
    g.drawImage(itemSpriteFor(it),0,0,IS,IS, pos.x+io, pos.y+io+bob, IS, IS);
    if(it.gen!==undefined){
      bubbles(g, pos.x+CELL/2, pos.y+26, i, (it.ch>0)?5:2);      // источник дышит пузырьками
      var pul=0.5+0.5*Math.sin(TIME*1.6+i*0.7);
      if(it.ch>0){
        g.globalAlpha=0.20+0.16*pul; g.fillStyle='#9df0ff';
        for(var b2=0;b2<10;b2++){ var ab=b2/10*Math.PI*2;
          g.fillRect(pos.x+CELL/2+Math.round(Math.cos(ab)*(26+pul*3))-1,
                     pos.y+30+Math.round(Math.sin(ab)*(18+pul*2))-1, 3,3); }
        g.globalAlpha=1;
      }
      g.fillStyle='rgba(3,22,36,0.85)'; g.fillRect(pos.x+8,pos.y+50,CELL-16,13);
      var f=Math.max(0,Math.min(1,it.ch/genCap(S.lvl)));
      g.fillStyle=(it.ch>0)?'#4fd6a0':'#ff6b6b'; g.fillRect(pos.x+10,pos.y+52,Math.round((CELL-20)*f),9);
      text(g, it.ch+'/'+genCap(S.lvl), pos.x+CELL/2, pos.y+56, 11, '#ffffff','center');
      if(it.ch<genCap(S.lvl)){
        var sec=Math.ceil(msToNextCharge(NOW)/1000);
        var lab='+1 in '+(sec>=60?'60s':(sec+'s'));
        g.fillStyle='rgba(24,96,128,0.9)'; g.fillRect(pos.x+6,pos.y+CELL-18,CELL-12,14);
        text(g, lab, pos.x+CELL/2, pos.y+CELL-11, 11, '#eafcff','center');
      }
    }
    if(it.gen===undefined){
      var lbl=String(it.t)+'/'+A_CHAINS[it.c].max;
      g.fillStyle='rgba(24,96,128,0.88)'; g.fillRect(pos.x+CELL-30,pos.y+CELL-19,26,15);
      g.fillStyle='rgba(190,238,255,0.55)'; g.fillRect(pos.x+CELL-30,pos.y+CELL-19,26,1);
      text(g, lbl, pos.x+CELL-17, pos.y+CELL-12, 12, '#f2fbff','center');
    }
    if(it.gen===undefined&&it.t>=DIVE_MIN){
      var top=(it.t>=A_CHAINS[it.c].max);
      g.fillStyle=top?'#ffe27a':'#7ff0d8';
      g.fillRect(pos.x+6,pos.y+6,CELL-12,3);
      if(top) g.fillRect(pos.x+6,pos.y+CELL-9,CELL-12,3);
      g.globalAlpha=0.30+0.14*Math.sin(TIME*3+i);      // цветной ореол ценной фишки
      g.fillStyle=top?'#ff7ad0':'#7ff0d8';
      for(var hh=0;hh<12;hh++){ var ah=hh/12*Math.PI*2;
        g.fillRect(pos.x+CELL/2+Math.round(Math.cos(ah)*30)-2,
                   pos.y+CELL/2+bob+Math.round(Math.sin(ah)*30)-2, 4,4); }
      g.globalAlpha=1;
      sparkle(g, pos.x+CELL/2, pos.y+CELL/2+bob, i, top);
      if(top) bubbles(g, pos.x+CELL/2+14, pos.y+30, i+3, 3);
    }
  }
}

var pointers={}, pcount=0;
function toLogic(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/(r.width/VW), y:(e.clientY-r.top)/(r.height/VH)};
}
function boardHit(x,y){
  if(x<BX||x>=BX+BOARD_W||y<BY||y>=BOARD_B) return -1;
  return idx(((x-BX)/CELL)|0, ((y-BY)/CELL)|0);
}
function onDown(x,y){
  ensureAudio();
  if(S.say && S.screen==='game' && y>=596 && y<=712){ S.say=null; return; }
  if(S.giftOpen){ if(inBtn(BTN.giftok,x,y)){ S.giftOpen=0; save(); } return; }
  if(S.curioOpen===-2){ if(inBtn(BTN.curiook,x,y)){ S.curioOpen=-1; save(); } return; }
  if(eventOpen){ if(inBtn(BTN.closeevt,x,y)){ eventOpen=false; save(); } return; }
  if(S.curioOpen>=0){ if(inBtn(BTN.curiook,x,y)){ S.curioOpen=-1; save(); } return; }
  if(S.relicOpen>=0){ if(inBtn(BTN.relicok,x,y)){ S.relicOpen=-1; save(); } return; }
  if(S.storyOpen>=0){ if(inBtn(BTN.storyok,x,y)){ S.storyOpen=-1; save(); } return; }
  if(S.relicOpen>=0){ if(inBtn(BTN.relicok,x,y)){ S.relicOpen=-1; save(); } return; }
  if(S.screen==='name'){ if(inBtn(BTN.namedone,x,y)) startGameFromName(); return; }
  if(S.diagOpen){
    if(inBtn(BTN.closediag,x,y)){ S.diagOpen=false; save(); return; }
    if(inBtn(BTN.backup,x,y)){
      var code=exportSave();
      try{ if(window.prompt) window.prompt('Copy this backup code:', code); }catch(e){}
      toast('Backup code shown — keep it safe');
      return;
    }
    if(inBtn(BTN.restore,x,y)){
      var got='';
      try{ got=window.prompt?(window.prompt('Paste a backup code:','')||''):''; }catch(e){ got=''; }
      if(got){ if(!importSave(got)) toast('That code could not be read'); }
      return;
    }
    return;
  }
  if(inBtn(BTN.diag,x,y)){ S.diagOpen=true; return; }
  if(S.screen!=='name' && inBtn(BTN.event,x,y)){ eventOpen=true; return; }
  if(inBtn(BTN.mute,x,y)){ S.mute=!S.mute; save(); return; }
  if(inBtn(BTN.nav_game,x,y)){ setScreen('game'); S.detail=-1; topOpen=false; save(); return; }
  if(inBtn(BTN.nav_city,x,y)){ setScreen('city'); fetchTop(); save(); return; }
  if(inBtn(BTN.nav_mus,x,y)){ setScreen('museum'); S.detail=-1; topOpen=false; save(); return; }
  if(inBtn(BTN.nav_shop,x,y)){ setScreen('shop'); S.detail=-1; topOpen=false; save(); return; }
  if(S.screen==='city'){
    if(topOpen){ if(inBtn(BTN.closetop,x,y)) topOpen=false; return; }
    if(S.detail>=0){
      if(inBtn(BTN.closedet,x,y)){ S.detail=-1; return; }
      if(S.built[S.detail]){
        var pl=S.plots[S.detail];
        for(var j=0;j<pl.length&&j<DETAIL_SLOTS.length;j++){
          var s2=DETAIL_SLOTS[j];
          if(x>=s2[0]&&x<=s2[0]+s2[2]&&y>=s2[1]&&y<=s2[1]+s2[2]){
            detachFromPlot(S.detail,j); sfxCoin(); pushScore(); save(); return; }
        }
      }
      return;
    }
    if(worldsOpen){
      if(inBtn(BTN.closewld,x,y)){ worldsOpen=false; return; }
      for(var wi=0;wi<REGIONS.length;wi++){
        var wc=worldCard(wi);
        if(x>=wc.x&&x<=wc.x+wc.w&&y>=wc.y&&y<=wc.y+wc.h){
          if(wi!==S.region && regionUnlocked(wi) && REGIONS[wi].chapters){
            travelTo(wi); worldsOpen=false; setScreen('game');
          }
          return;
        }
      }
      return;
    }
    if(achOpen){ if(inBtn(BTN.closeach,x,y)) achOpen=false; return; }
    if(inBtn(BTN.achs,x,y)){ achOpen=true; checkAchievements(); return; }
    if(inBtn(BTN.worlds,x,y)){ worldsOpen=true; return; }
    if(inBtn(BTN.top,x,y)){ topOpen=true; fetchTop(); return; }
    var i,c;
    for(i=0;i<6;i++){ c=siteCard(i);
      if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
        if(S.sel&&S.built[i]){
          if(attachToPlot(i,S.sel.k)){ sfxBuild(); burst(c.x+150,c.y+80,'#9df0ff',14); pushScore(); save(); }
          if(!S.owned[S.sel.k]) S.sel=null;
        } else S.detail=i;
        return;
      } }
    var n=0;
    for(i=0;i<A_DECOR.length;i++){ if(!S.owned[i]) continue;
      var b=chipBox(n);
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y+14&&y<=b.y+14+b.h){ S.sel={kind:'dec',k:i}; return; } n++; }
    return;
  }
  if(S.screen==='museum'){
    for(var mi=0;mi<A_RELICS.length;mi++){ var q=plaque(mi);
      if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h&&S.relics[mi]>0){ S.relicOpen=mi; return; } }
    if(inBtn(BTN.musPrev,x,y)){ S.curioPage=(curioPage()+curioPages()-1)%curioPages(); save(); return; }
    if(inBtn(BTN.musNext,x,y)){ S.curioPage=(curioPage()+1)%curioPages(); save(); return; }
    for(var ci2=0;ci2<CUR_PER;ci2++){ var k4=curioAt(ci2); if(k4<0) continue;
      var cb2=curioBox(ci2);
      if(x>=cb2.x&&x<=cb2.x+cb2.w&&y>=cb2.y&&y<=cb2.y+cb2.h&&S.curios[k4]){ S.curioOpen=k4; return; } }
    return;
  }
  if(S.screen==='shop'){
    if(x>=20&&x<=512&&y>=750&&y<=808){
      if(buyFund()){ sfxCoin(); fly(270, 742, '-'+fundPrice(), '#9bf7a8'); save(); }
      return;
    }
    if(inBtn(BTN.shopPrev,x,y)){ S.shopPage=(shopPage()+shopPages()-1)%shopPages(); sfxCoin(); save(); return; }
    if(inBtn(BTN.shopNext,x,y)){ S.shopPage=(shopPage()+1)%shopPages(); sfxCoin(); save(); return; }
    for(var k=0;k<SHOP_PER;k++){ var kk=shopItemAt(k); if(kk<0) continue;
      var sc=shopCard(k);
      if(x>=sc.x&&x<=sc.x+sc.w&&y>=sc.y&&y<=sc.y+sc.h){
        if(buyDecor(kk)){ sfxCoin(); fly(sc.x+sc.w/2, sc.y+10, '-'+A_DECOR[kk].price, '#ffe27a'); save(); }
        return; } }
    return;
  }
  var bi=boardHit(x,y);
  if(bi<0) return;
  var it=S.board[bi];
  if(!it) return;
  if(it.gen!==undefined){
    if(tapGenerator(bi)){ sfxMerge(1); burst(BX+(bi%COLS)*CELL+40, BY+((bi/COLS)|0)*CELL+40,'#d8f4ff',8); save(); }
    return;
  }
  drag={from:bi, item:it, x:x, y:y, moved:false};
}
function onMove(x,y){ if(drag){ drag.x=x; drag.y=y; drag.moved=true; } }
function onUp(x,y){
  if(!drag) return;
  var d=drag; drag=null;
  if(x>=DIVER.x&&x<=DIVER.x+DIVER.w&&y>=DIVER.y&&y<=DIVER.y+DIVER.h){
    if(dive(d.from, NOW)){ sfxMerge(3); burst(DIVER.x+40, DIVER.y+26, '#9df0ff', 20);
      fly(DIVER.x+DIVER.w/2, DIVER.y+16, 'DIVING', '#9df0ff');
      if(S.tip===4) S.tip=5; pushScore(); save(); }
    else shakeCell(d.from);
    return;
  }
  if(x>=SELL.x&&x<=SELL.x+SELL.w&&y>=SELL.y&&y<=SELL.y+SELL.h){
    var sval=(d.item&&d.item.gen===undefined)?itemValue(d.item.c,d.item.t):0;
    if(sellItem(d.from)){ sfxCoin(); burst(430,72,'#ffe27a',14);
      fly(SELL.x+SELL.w/2, SELL.y+10, '+'+sval, '#ffe27a');
      if(S.tip===5) S.tip=6; save(); }
    else shakeCell(d.from);
    return;
  }
  var sl=cardSlots(), ci;
  for(ci=0;ci<4;ci++){
    var b=cardBox(ci), s=sl[ci];
    if(!s) continue;
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
      if(s.type==='chap'){
        var wasCh=S.chapter;
        if(deliverToChapter(s.idx,d.from)){ if(S.chapter!==wasCh) sfxChapter(); else sfxBuild();
          burst(b.x+63,b.y+30,'#9bf7a8',18);
          fly(b.x+b.w/2, b.y+6, 'INSTALLED', '#9bf7a8');
          if(S.tip===2) S.tip=3; fillOrder(); pushScore(); save(); }
        else shakeCell(d.from);
      } else {
        var q0=S.orders[s.idx], pay=q0?q0.coin:0;
        if(deliverToOrder(d.from, s.idx)){ sfxCoin(); burst(b.x+63,b.y+30,'#ffe27a',16);
          fly(b.x+b.w/2, b.y+6, '+'+pay, '#ffe27a'); save(); }
        else shakeCell(d.from);
      }
      return;
    }
  }
  var to=boardHit(x,y);
  if(to<0) return;
  if(to===d.from && !d.moved){                 // тап без переноса = спросить, что это
    var nm=itemName(d.item);
    if(d.item.gen!==undefined) toast(nm+' · '+d.item.ch+' charges left');
    else toast(nm+' · tier '+d.item.t+'/'+A_CHAINS[d.item.c].max+' · sells for '+itemValue(d.item.c,d.item.t));
    return;
  }
  var before=S.board[to];
  var same=(before&&d.item&&before.c===d.item.c&&before.t===d.item.t);
  var okMove=moveItem(d.from,to);
  if(!okMove){ shakeCell(d.from); return; }
  if(okMove){
    if(same){
      var p=cellXY(to), mx=p.x+CELL/2, my=p.y+CELL/2, nt=d.item.t+1;
      if(nt>=BIG_TIER){
        sfxBig(nt); fx('big',mx,my,nt,'#ffe9a8');
        burst(mx,my,'#ffe27a',30); burst(mx,my,'#9df0ff',18);
      } else {
        sfxMerge(nt); fx('merge',mx,my,nt,'#ffe27a');
        burst(mx,my,'#ffe27a',14);
      }
      fly(mx, my-16, A_TIERS[d.item.c][nt-1], nt>=BIG_TIER?'#fff3c4':'#eafcff');
    }
    save();
  }
}
function startGameFromName(){
  var nm='';
  try{ nm=window.prompt?(window.prompt('Your name (max 12):','Diver')||''):''; }catch(e){ nm=''; }
  S.name=(nm||'Diver').slice(0,12);
  S.screen='game'; placeGenerators(); fillOrder(); save();
}
function bindInput(){
  if(!cv.addEventListener) return;
  var stop=function(e){ if(e.preventDefault) e.preventDefault(); };
  ['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(function(n){
    document.addEventListener(n, stop, {passive:false});
  });
  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    pointers[e.pointerId]=1; pcount++;
    if(cv.setPointerCapture) try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(pcount===1){ var p=toLogic(e); onDown(p.x,p.y); }
  }, {passive:false});
  cv.addEventListener('pointermove', function(e){
    e.preventDefault(); var p=toLogic(e); onMove(p.x,p.y);
  }, {passive:false});
  var up=function(e){
    e.preventDefault();
    if(pointers[e.pointerId]){ delete pointers[e.pointerId]; pcount=Math.max(0,pcount-1); }
    if(pcount===0){ var p=toLogic(e); onUp(p.x,p.y); }
  };
  cv.addEventListener('pointerup', up, {passive:false});
  cv.addEventListener('pointercancel', up, {passive:false});
  document.addEventListener('visibilitychange', function(){ save(); });
}

/* ================= ЦИКЛ ================= */
var lastT=0, lastTip=-1, NOW=0, emptyNoted=false, FRAMES_SINCE_GEN=0, SAVE_TICK=0, FRAME_N=0;
function frame(now){
  try{
    var dt=Math.min(0.05,(now-lastT)/1000||0); lastT=now;
    TIME+=dt;
    NOW=Date.now();
    if(BOOT_ERR){ render(); return; }
    if((FRAME_N++ % 30)===0){                   // самолечение раскладки
      var r=cv.getBoundingClientRect ? cv.getBoundingClientRect() : null;
      if(!FIT_OK || (r && !(r.width>40 && r.height>40))) fit();
    }
    var got=regen(NOW);
    if(got>0){ save(); }
    if(collectDive(NOW)){ if(S.relicOpen>=0) sfxRelic(); else sfxBuild();
      burst(DIVER.x+40, DIVER.y+26, '#9df0ff', 22); pushScore(); save(); }
    if(FRAMES_SINCE_GEN++>60){ FRAMES_SINCE_GEN=0; if(missingGens().length) placeGenerators(); }
    S.stats.playMs+=dt*1000;
    if(allGensEmpty()) S.stats.emptyMs+=dt*1000;
    if(SAVE_TICK++>600){ SAVE_TICK=0; save(); }
    if(allGensEmpty()){
      if(!emptyNoted){ emptyNoted=true;
        toast('No charges. Merge tier 4+, deliver parts, or send the diver down.'); }
    } else emptyNoted=false;
    for(var i=TOASTS.length-1;i>=0;i--){ TOASTS[i].t+=dt; if(TOASTS[i].t>2.4) TOASTS.splice(i,1); }
    stepSay(dt);
    if(S.screen==='game' && S.tip!==lastTip){ lastTip=S.tip; var tp=tipText(); if(tp) toast(tp); }
    stepParts(dt); stepFX(dt); stepFly(dt); stepTrans(dt); stepShake(dt); stepAchFX(dt);
    if((FRAME_N%20)===0) checkAchievements();
    musicTick(now);
    render();
  }catch(e){ try{ console.error(e); }catch(e2){} }
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(frame);
}
var BOOT_ERR='';
function drawBootError(g){
  g.fillStyle='#0b1b2a'; g.fillRect(0,0,VW,VH);
  panel(g,20,200,500,300,'rgba(70,20,26,0.96)');
  text(g,'THE GAME FAILED TO START', 270, 250, 22, '#ffb3a0','center');
  wrap(g, BOOT_ERR, 40, 300, 15, '#ffffff', 40, 26);
  text(g,'Tap to try again', 270, 470, 16, '#ffd487','center');
}
function boot(){
  try{
    load(); NOW=Date.now(); if(!S.regenAt) S.regenAt=NOW; regen(NOW); collectDive(NOW);
    fit(); bindInput();
    if(S.name) S.screen=(S.screen==='name')?'game':S.screen;
  }catch(e){
    BOOT_ERR=(e&&e.message)?String(e.message):'unknown error';
    try{ console.error(e); }catch(e2){}
    if(!S) S=baseState();
    try{ cv.addEventListener('pointerdown', function(){ BOOT_ERR=''; boot(); }, {once:true}); }catch(e3){}
  }
  try{ window.__gameStarted=1;                       // сторож запуска отбой
       if(typeof sessionStorage!=='undefined') sessionStorage.removeItem('sunken_selfheal'); }catch(e){}
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(frame);
  // service worker регистрируем ПОСЛЕ старта игры, чтобы он не мешал первой загрузке
  if(typeof setTimeout!=='undefined') setTimeout(function(){
    if('serviceWorker' in navigator && window.self===window.top){
      try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
      try{
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(!window.__swReloaded){ window.__swReloaded=1; save();
            if(location&&location.reload) setTimeout(function(){ location.reload(); }, 300); }
        });
      }catch(e){}
    }
  }, 2500);
}
